[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Conservative target: Portaldot's pallet-revive EVM backend and Base both accept it.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[fmt]
line_length = 110
